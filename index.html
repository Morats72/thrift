<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Good Finds</title>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Good Finds">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#f4ecdc">
<link rel="stylesheet" href="leaflet.css">
<link rel="stylesheet" href="maplibre-gl.css">
<style>
:root{
  --paper:#f4ecdc; --card:#fffaf0; --ink:#2a2620; --soft:#6f6658; --line:#dccfb6;
  --green:#2f6b4f; --rust:#b4532a; --gold:#c98a12;
  --serif:ui-serif,"Iowan Old Style","Palatino Linotype",Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --top:env(safe-area-inset-top,0px); --bot:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
#map{position:fixed;inset:0;background:#e9e2d0}
.leaflet-container{font-family:var(--sans)}
.leaflet-control-attribution{font-size:10px;background:rgba(244,236,220,.8)!important;margin-bottom:var(--bot)!important}

header{position:fixed;top:0;left:0;right:0;z-index:1000;padding:calc(var(--top) + 8px) 0 8px;
  background:linear-gradient(rgba(244,236,220,.97),rgba(244,236,220,.9));border-bottom:1px solid var(--line);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.bar{display:flex;align-items:baseline;justify-content:space-between;padding:0 16px 8px}
h1{font-family:var(--serif);font-size:22px;margin:0;letter-spacing:.2px;font-weight:700}
#ver{font:500 11px var(--sans);color:var(--soft);letter-spacing:.3px;vertical-align:middle}
h1 i{color:var(--rust);font-style:italic;font-weight:400}
#status{font-size:12px;color:var(--soft);border:1px solid var(--line);border-radius:99px;padding:3px 10px;background:var(--card)}
#status.warn{color:var(--rust);border-color:var(--rust)}
#status.ok{color:var(--green)}
#chips{display:flex;gap:8px;overflow-x:auto;padding:0 16px;scrollbar-width:none}
#chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 12px;font-size:14px;white-space:nowrap}
.chip b{font-weight:500;color:var(--soft);margin-left:4px;font-size:12px}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip.on b{color:#cfc5b0}

.pin{width:34px;height:34px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--c);border:2px solid #fff;
  box-shadow:0 2px 5px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center}
.pin span{transform:rotate(45deg);font-size:16px;line-height:1}
.pin.sel{outline:3px solid var(--ink);outline-offset:1px}
.medot{width:16px;height:16px;border-radius:50%;background:#1f6fd0;border:3px solid #fff;box-shadow:0 0 0 2px rgba(31,111,208,.35)}

.fabs{position:fixed;right:14px;bottom:calc(var(--bot) + 22px);z-index:1000;display:flex;flex-direction:column;gap:10px}
.fab{width:52px;height:52px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:22px;box-shadow:0 3px 10px rgba(0,0,0,.2)}
.fab.main{background:var(--rust);color:#fff;border-color:var(--rust);font-size:30px;line-height:1}

.fabs.left{right:auto;left:14px}
.fab{position:relative}
#rcount{position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;border-radius:10px;background:var(--rust);color:#fff;font:600 12px/20px var(--sans);font-style:normal;padding:0 5px}
.pin.rt{box-shadow:0 0 0 3px var(--rust),0 2px 5px rgba(0,0,0,.35)}
.pin.done{opacity:.55}
.pin.tmp{border-style:dashed}
.num{position:absolute;left:22px;top:-8px;min-width:20px;height:20px;border-radius:10px;background:var(--ink);color:#fff;font:700 12px/20px var(--sans);text-align:center;padding:0 5px;border:1.5px solid #fff}
.cnt{font:14px var(--sans);color:var(--soft);font-weight:400}
.seg{display:flex;gap:6px;margin:10px 0 2px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 11px;font-size:13px}
.seg button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.item.pick .box{flex:none;width:24px;height:24px;border-radius:7px;border:2px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;color:#fff}
.item.pick.on .box{background:var(--green);border-color:var(--green)}
.item.pick.on .box:before{content:"✓"}
label.check{display:flex;align-items:center;gap:10px;text-transform:none;letter-spacing:0;font-size:15px;color:var(--ink)}
label.check input{width:22px;height:22px}
.stop{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.stop .n{flex:none;width:28px;height:28px;border-radius:50%;background:var(--ink);color:#fff;font:700 13px/28px var(--sans);text-align:center}
.stop .t{flex:1;min-width:0;border:0;background:none;text-align:left;padding:0}
.stop .t div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stop small{color:var(--soft)}
.stop.done .t,.stop.done .n{opacity:.45}
.stop.done .t div{text-decoration:line-through}
.mini{flex:none;border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:8px 10px;font-size:14px;text-decoration:none;color:var(--ink)}
.mini.on{background:var(--green);border-color:var(--green);color:#fff}
.btn.stamp{background:var(--gold);border-color:var(--gold);color:#fff;font-weight:600}
.vchips{display:flex;flex-wrap:wrap;gap:6px}
.vchip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 10px;font-size:13px}
body.hybrid .leaflet-control-attribution{background:rgba(244,236,220,.92)!important}
#cross{position:fixed;left:50%;top:50%;z-index:900;width:44px;height:44px;margin:-22px 0 0 -22px;pointer-events:none;display:none}
#cross:before,#cross:after{content:"";position:absolute;background:var(--rust)}
#cross:before{left:21px;top:0;width:2px;height:44px}
#cross:after{top:21px;left:0;height:2px;width:44px}
#placebar{position:fixed;left:12px;right:12px;bottom:calc(var(--bot) + 16px);z-index:1100;background:var(--card);border:1px solid var(--line);
  border-radius:16px;padding:14px;box-shadow:0 6px 20px rgba(0,0,0,.25);display:none}
#placebar p{margin:0 0 10px;font-size:14px;color:var(--soft)}
body.placing #cross,body.placing #placebar{display:block}
body.placing .fabs{display:none}
body.placing #cross:before,body.placing #cross:after{box-shadow:0 0 0 1px #fff}

#sheet{position:fixed;left:0;right:0;bottom:0;z-index:1200;max-height:78vh;overflow-y:auto;-webkit-overflow-scrolling:touch;
  background:var(--card);border-radius:20px 20px 0 0;border-top:1px solid var(--line);box-shadow:0 -6px 24px rgba(0,0,0,.22);
  padding:10px 18px calc(var(--bot) + 20px);transform:translateY(105%);transition:transform .22s ease}
#sheet.open{transform:none}
.grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 12px}
.x{position:absolute;right:12px;top:10px;border:0;background:none;font-size:26px;color:var(--soft);width:40px;height:40px}
h2{font-family:var(--serif);font-size:22px;margin:0 40px 6px 0;line-height:1.2}
.meta{color:var(--soft);font-size:14px;margin:2px 0}
.badge{display:inline-block;border-radius:99px;padding:3px 10px;font-size:13px;color:#fff;background:var(--c)}
.stars{font-size:22px;letter-spacing:2px;color:var(--gold)}
.stars button{border:0;background:none;font-size:30px;padding:0 3px;color:var(--line)}
.stars button.on{color:var(--gold)}
.note{white-space:pre-wrap;background:var(--paper);border-radius:10px;padding:10px 12px;margin:10px 0;font-size:15px}
.row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.btn{flex:1;min-width:90px;border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:12px 10px;font-size:15px;text-align:center;text-decoration:none;color:var(--ink)}
.btn.go{background:var(--green);border-color:var(--green);color:#fff;font-weight:600}
.btn.danger{color:var(--rust)}
.btn.danger.arm{background:var(--rust);color:#fff;border-color:var(--rust)}
label{display:block;font-size:13px;color:var(--soft);margin:14px 0 5px;text-transform:uppercase;letter-spacing:.6px}
input[type=text],input[type=date],input[type=url],input[type=search],textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 12px;background:#fff;font-size:16px}
textarea{min-height:80px;resize:vertical}
.cats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.cats button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px;text-align:left;font-size:15px}
.cats button.on{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.item{display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);width:100%;background:none;border-width:0 0 1px;text-align:left}
.item .dot{flex:none;width:34px;height:34px;border-radius:50%;background:var(--c);display:flex;align-items:center;justify-content:center;font-size:16px}
.item .t{flex:1;min-width:0}
.item .t div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item small{color:var(--soft)}
.hint{font-size:13px;color:var(--soft);margin:6px 0 0;line-height:1.4}
#toast{position:fixed;left:50%;top:calc(var(--top) + 110px);transform:translateX(-50%);z-index:2000;background:var(--ink);color:var(--paper);
  padding:10px 16px;border-radius:99px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:88vw;text-align:center}
#toast.show{opacity:.95}
</style>
</head>
<body>
<div id="map"></div>
<header>
  <div class="bar"><h1>Good <i>Finds</i> <small id="ver"></small></h1><span id="status">…</span></div>
  <div id="chips"></div>
</header>
<div id="cross"></div>
<div class="fabs left">
  <button class="fab" data-act="search" aria-label="Find an address">🔍</button>
  <button class="fab" data-act="layer" aria-label="Switch map view">🛰️</button>
  <button class="fab" data-act="route" aria-label="Plan a route">🧭<i id="rcount" hidden></i></button>
</div>
<div class="fabs">
  <button class="fab" data-act="settings" aria-label="Settings">⚙️</button>
  <button class="fab" data-act="list" aria-label="List">☰</button>
  <button class="fab" data-act="locate" aria-label="Where am I">◎</button>
  <button class="fab main" data-act="add" aria-label="Add a spot">+</button>
</div>
<div id="placebar">
  <p id="placemsg">Slide the map until the crosshair sits on the spot.</p>
  <div class="row" style="margin:0">
    <button class="btn" data-act="place-me">Use where I'm standing</button>
    <button class="btn go" data-act="place-ok">Drop it here</button>
    <button class="btn" data-act="place-cancel" style="flex:0 0 auto;min-width:0">Cancel</button>
  </div>
</div>
<section id="sheet" aria-live="polite"></section>
<div id="toast"></div>
<script src="leaflet.js"></script>
<script src="maplibre-gl.js"></script>
<script src="leaflet-maplibre-gl.js"></script>
<script src="lib.js"></script>
<script src="app.js"></script>
</body>
</html>
